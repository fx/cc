# Regenerating the snapshot
# -------------------------
# `.duvet/snapshot.txt` is committed and `duvet report --ci` fails whenever the
# re-derived report disagrees with it. After editing the spec or any annotation,
# regenerate with:
#
#     rm -rf .duvet/requirements && duvet report
#
# The `rm -rf` is not optional. `duvet report` writes one TOML file per current
# spec section into `.duvet/requirements/` and never deletes stale ones, so
# renaming or removing a requirement heading leaves an orphan TOML behind. That
# orphan makes duvet fail locally with `missing section "..."` while CI — which
# runs from a fresh checkout, and where `.duvet/requirements/` is gitignored —
# passes. Deleting the directory first keeps local and CI results identical.

'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

# The marketplace-structure spec is prose markdown, not an IETF RFC. Without an
# explicit `format`, duvet applies the `ietf` parser, which silently extracts
# zero requirements from this document rather than failing.
[[specification]]
source = "docs/specs/marketplace-structure/index.md"
format = "markdown"

# The fx-dev authority spec is likewise prose markdown and needs the same
# explicit `format` for the same reason.
[[specification]]
source = "docs/specs/fx-dev-authority/index.md"
format = "markdown"

# These citations are `implication`, not `test`. Each one sits on a bash
# assertion that both enforces the invariant and verifies it: the assertion is
# the only implementation the invariant has, and because it gates every pull
# request the invariant cannot reach `main` violated. That is duvet's meaning
# for `implication` — a requirement satisfied by construction rather than by
# separate implementing and testing code.
#
# `test` alone would leave duvet with no implementation anchor: `duvet query -c
# implementation` counts only `implementation`, `implication`, and `exception`,
# so every requirement would report as unimplemented, while `duvet query -c
# test` would pass vacuously against zero counted requirements.
#
# `#=`/`#%` are the YAML/shell comment equivalents of duvet's `//=`/`//#`
# defaults.
[[source]]
pattern = ".github/workflows/*.yml"
type = "implication"
comment-style = { meta = "#=", content = "#%" }

# The fx-dev authority requirements are `implication` for a different reason:
# the skills ARE the implementation. Each requirement is a rule stated in a
# prompt document and honored by the agent that loads it — there is no hook, CI
# job, or runtime guard to cite, and nothing to unit-test. The citation marks
# the sentence in the skill that carries the rule.
#
# SKILL.md files are markdown, which has no line-comment syntax, so these
# citations live inside HTML comments. That forces a different comment style
# from the workflow source above: `duvet=`/`duvet#` are used instead of the
# `//=`/`//#` defaults because a bare `//` prefix inside an HTML comment is
# indistinguishable from ordinary prose. The `<!--` and `-->` delimiters MUST
# sit on their own lines — duvet reads the whole line after the meta prefix, so
# a single-line `<!--= ... -->` folds the trailing delimiter into the value and
# fails to parse.
[[source]]
pattern = "plugins/fx-dev/skills/**/SKILL.md"
type = "implication"
comment-style = { meta = "duvet=", content = "duvet#" }

[report.snapshot]
enabled = true
path = ".duvet/snapshot.txt"

[report.json]
enabled = true
path = ".duvet/reports/report.json"
