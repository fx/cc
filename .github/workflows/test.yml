name: Test Marketplace

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate marketplace.json
        run: |
          echo "Validating marketplace manifest..."

          #= docs/specs/marketplace-structure/index.md#marketplace-manifest-is-parseable
          #= type=implication
          #% The repository MUST contain a `.claude-plugin/marketplace.json` file that parses as valid JSON.
          jq empty .claude-plugin/marketplace.json

          # Check required fields
          #= docs/specs/marketplace-structure/index.md#marketplace-manifest-declares-its-identity
          #= type=implication
          #% `.claude-plugin/marketplace.json` MUST declare the top-level fields `name`, `owner`, and `plugins`.
          jq -e '.name' .claude-plugin/marketplace.json > /dev/null || (echo "Missing 'name' field" && exit 1)
          jq -e '.owner' .claude-plugin/marketplace.json > /dev/null || (echo "Missing 'owner' field" && exit 1)
          jq -e '.plugins' .claude-plugin/marketplace.json > /dev/null || (echo "Missing 'plugins' field" && exit 1)

          echo "✓ marketplace.json is valid"

      - name: Validate plugin manifests
        run: |
          echo "Validating plugin manifests..."
          for plugin_json in plugins/*/.claude-plugin/plugin.json; do
            if [ -f "$plugin_json" ]; then
              echo "Validating $plugin_json..."

              #= docs/specs/marketplace-structure/index.md#plugin-manifests-are-parseable
              #= type=implication
              #% Every `plugins/*/.claude-plugin/plugin.json` file MUST parse as valid JSON.
              jq empty "$plugin_json"

              # Check required fields
              plugin_dir=$(dirname "$(dirname "$plugin_json")")
              #= docs/specs/marketplace-structure/index.md#plugin-manifests-declare-name-and-version
              #= type=implication
              #% Every `plugins/*/.claude-plugin/plugin.json` file MUST declare the top-level fields `name` and `version`.
              jq -e '.name' "$plugin_json" > /dev/null || (echo "Missing 'name' in $plugin_json" && exit 1)
              jq -e '.version' "$plugin_json" > /dev/null || (echo "Missing 'version' in $plugin_json" && exit 1)

              echo "✓ $plugin_json is valid"
            fi
          done

      - name: Verify plugin files exist
        run: |
          echo "Verifying plugin files..."
          for plugin_dir in plugins/*/; do
            plugin_name=$(basename "$plugin_dir")
            plugin_json="$plugin_dir.claude-plugin/plugin.json"

            #= docs/specs/marketplace-structure/index.md#every-plugin-directory-carries-a-manifest
            #= type=implication
            #% Every directory directly under `plugins/` MUST contain a `.claude-plugin/plugin.json` file.
            if [ ! -f "$plugin_json" ]; then
              echo "Missing plugin.json for $plugin_name"
              exit 1
            fi

            # Check if referenced files exist
            #= docs/specs/marketplace-structure/index.md#declared-component-paths-resolve
            #= type=implication
            #% Every path listed in a plugin manifest's `skills` or `agents` array MUST resolve to an existing file, interpreted relative to that plugin's own directory.
            if jq -e '.skills' "$plugin_json" > /dev/null; then
              for skill in $(jq -r '.skills[]' "$plugin_json"); do
                skill_path="$plugin_dir$skill"
                if [ ! -f "$skill_path" ]; then
                  echo "Missing skill file: $skill_path"
                  exit 1
                fi
                echo "✓ Found skill: $skill_path"
              done
            fi

            if jq -e '.agents' "$plugin_json" > /dev/null; then
              for agent in $(jq -r '.agents[]' "$plugin_json"); do
                agent_path="$plugin_dir$agent"
                if [ ! -f "$agent_path" ]; then
                  echo "Missing agent file: $agent_path"
                  exit 1
                fi
                echo "✓ Found agent: $agent_path"
              done
            fi
          done

      - name: Validate markdown frontmatter
        run: |
          echo "Validating markdown files..."
          #= docs/specs/marketplace-structure/index.md#plugin-markdown-carries-frontmatter
          #= type=implication
          #% Every markdown file under `plugins/` other than a file named `README.md` SHOULD begin with a `---` frontmatter delimiter on its first line.
          find plugins -name '*.md' | while read -r md_file; do
            if [ -f "$md_file" ] && [ "$(basename "$md_file")" != "README.md" ]; then
              echo "Checking $md_file..."

              # Check for frontmatter
              if ! head -n 1 "$md_file" | grep -q "^---$"; then
                echo "Warning: $md_file may be missing frontmatter"
              else
                echo "✓ $md_file has frontmatter"
              fi
            fi
          done

      - name: Verify marketplace references plugins correctly
        run: |
          echo "Verifying marketplace plugin references..."
          #= docs/specs/marketplace-structure/index.md#marketplace-entries-resolve-to-plugin-directories
          #= type=implication
          #% Every entry in `.claude-plugin/marketplace.json` whose `source` begins with `./` MUST resolve to an existing directory that contains a `.claude-plugin/plugin.json` file.
          for plugin in $(jq -r '.plugins[].name' .claude-plugin/marketplace.json); do
            source=$(jq -r ".plugins[] | select(.name==\"$plugin\") | .source" .claude-plugin/marketplace.json)

            # Handle relative paths
            if [[ "$source" == ./* ]]; then
              plugin_dir="${source#./}"
              if [ ! -d "$plugin_dir" ]; then
                echo "Plugin directory not found: $plugin_dir"
                exit 1
              fi
              if [ ! -f "$plugin_dir/.claude-plugin/plugin.json" ]; then
                echo "Plugin manifest not found: $plugin_dir/.claude-plugin/plugin.json"
                exit 1
              fi
              echo "✓ Plugin '$plugin' exists at $plugin_dir"
            fi
          done

      - name: Test marketplace accessibility (after merge)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Waiting for GitHub Pages to deploy..."
          sleep 30

          # Try to fetch marketplace.json
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cc.fx.gd/.claude-plugin/marketplace.json)

          if [ "$STATUS" = "200" ]; then
            echo "✓ Marketplace is accessible at https://cc.fx.gd/"
          else
            echo "⚠ Marketplace returned status $STATUS (may take a few minutes to deploy)"
          fi

  duvet:
    name: Requirements traceability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The action only installs duvet; its default version input is a stale
      # 0.3.0, so pin to the version the snapshot was generated with.
      - name: Install duvet
        uses: awslabs/duvet@main
        with:
          version: 0.4.3

      # The actual coverage gate. `duvet report --ci` only diffs the committed
      # snapshot — duvet's own coverage enforcement is skipped whenever a
      # snapshot path is configured — so without this step a requirement with
      # no citing annotation would pass CI unnoticed.
      - name: Verify every requirement is implemented
        run: duvet query -c implementation

      # `--ci` re-derives the report and diffs it against the committed
      # snapshot, failing if annotations and .duvet/snapshot.txt disagree.
      - name: Verify requirement coverage snapshot
        run: duvet report --ci

      # Runs only when one of the two steps above failed, so a contributor
      # looking at a red job finds the remedy in the job log itself.
      - name: How to fix a failing duvet job
        if: failure()
        run: |
          cat <<'EOF'
          Requirements traceability failed. The two gates fail for different reasons:

          "Verify every requirement is implemented" (duvet query -c implementation)
            A MUST/SHOULD sentence in docs/specs/marketplace-structure/index.md has
            no annotation citing it. Add a `#= <spec>#<section>` / `#= type=implication`
            / `#% <quoted sentence>` comment above the check that enforces it in this
            workflow, or remove the requirement from the spec.

          "Verify requirement coverage snapshot" (duvet report --ci)
            The spec or the annotations changed but .duvet/snapshot.txt was not
            regenerated. Locally run:

                rm -rf .duvet/requirements && duvet report

            and commit the updated .duvet/snapshot.txt. The `rm -rf` matters:
            duvet writes one TOML per current spec section into .duvet/requirements/
            and never deletes stale ones, so a renamed heading leaves an orphan that
            fails locally with `missing section "..."` while CI passes.
          EOF
